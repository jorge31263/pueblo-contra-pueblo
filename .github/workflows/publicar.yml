name: Publicar

on:
  push:
    branches: [main]
  # Sin esto, las pruebas se ejecutan por primera vez en el mismo job que
  # publica: el fallo aparecería después de haber fusionado.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Construir y desplegar van en jobs separados a propósito. Juntos, el
  # despliegue preguntaba por el artefacto medio segundo después de terminar
  # de subirlo y la API todavía no lo veía ("Found 0 artifacts"): un fallo que
  # parecía aleatorio. Y reintentar el job subía un segundo artefacto con el
  # mismo nombre, que deja la ejecución rota sin remedio. Separados, el
  # despliegue espera a que el otro job acabe y se puede reintentar solo.
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

      # El contraste y el tamaño del texto solo se miden en la página pintada:
      # escanear los .tsx no habría visto el gris de los textos menores, que
      # llevaba tiempo por debajo del mínimo de la WCAG. Por eso se revisa lo
      # construido y servido, y antes de subir el artefacto: así un fallo de
      # accesibilidad no llega a desplegarse.
      - name: Revisar la accesibilidad de lo construido
        run: |
          npx vite preview --port 4173 &
          npx --yes wait-on -t 60000 http://localhost:4173
          # A lo ancho de un escritorio y a lo ancho de un móvil. El móvil es
          # el sitio principal del juego, y lo que solo se estrecha ahí no se
          # ve escaneando a 1280.
          for ancho in 1280x800 390x844; do
            # --no-advisory: las notas de tipografía no tumban nada y, en
            # cada ejecución, enseñan a ignorar las anotaciones. Se ven en
            # local con `npx impeccable detect`.
            npx --yes impeccable@4.11.1 detect --github --no-advisory --viewport "$ancho" \
              http://localhost:4173 \
              'http://localhost:4173/#libre=abc123'
          done
          # Sin hallazgos el detector no imprime nada, y un paso verde
          # mudo no distingue "ha mirado" de "no ha corrido".
          echo 'Sin anti-patrones en el inicio ni en la ronda, ni a 1280 ni a 390.'

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  desplegar:
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
